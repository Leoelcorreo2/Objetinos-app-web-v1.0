<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,
    maximum-scale=1,user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#b86549"
  >

  <title>Objetinos Contrareloj</title>

  <link
    rel="stylesheet"
    href="css/estilo.css"
  >

</head>


<body>

<div id="app">

  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header>

    <div>
      <div class="title">
        🛒 Objetinos Contrareloj
      </div>

      <div class="sub">
        V1.4.1
      </div>
    </div>


    <div class="stats">

      <div class="pill">
        ⭐ <b id="score">0</b>
      </div>

      <div class="pill">
        🪙 <b id="coins">0</b>
      </div>

      <div class="pill">
        NIVEL <b id="level">1</b>
      </div>

      <div class="timer" id="timer">
        30s
      </div>

    </div>

  </header>


  <!-- =====================================================
       ESCENA / TABLERO
       ===================================================== -->

  <main id="scene">

    <div id="cabinets">

      <!-- ARMARIO IZQUIERDO -->

      <section class="cabinet left">

        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="0"></div>
            <div class="cell" data-pos="1"></div>
            <div class="cell" data-pos="2"></div>

          </div>
        </div>


        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="3"></div>
            <div class="cell" data-pos="4"></div>
            <div class="cell" data-pos="5"></div>

          </div>
        </div>


        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="6"></div>
            <div class="cell" data-pos="7"></div>
            <div class="cell" data-pos="8"></div>

          </div>
        </div>


        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="9"></div>
            <div class="cell" data-pos="10"></div>
            <div class="cell" data-pos="11"></div>

          </div>
        </div>

      </section>


      <!-- ARMARIO CENTRAL -->

      <section class="cabinet center">

        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="12"></div>
            <div class="cell" data-pos="13"></div>
            <div class="cell" data-pos="14"></div>

          </div>
        </div>


        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="15"></div>
            <div class="cell" data-pos="16"></div>
            <div class="cell" data-pos="17"></div>

          </div>
        </div>


        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="18"></div>
            <div class="cell" data-pos="19"></div>
            <div class="cell" data-pos="20"></div>

          </div>
        </div>


        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="21"></div>
            <div class="cell" data-pos="22"></div>
            <div class="cell" data-pos="23"></div>

          </div>
        </div>

      </section>


      <!-- ARMARIO DERECHO -->

      <section class="cabinet right">

        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="24"></div>
            <div class="cell" data-pos="25"></div>
            <div class="cell" data-pos="26"></div>

          </div>
        </div>


        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="27"></div>
            <div class="cell" data-pos="28"></div>
            <div class="cell" data-pos="29"></div>

          </div>
        </div>


        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="30"></div>
            <div class="cell" data-pos="31"></div>
            <div class="cell" data-pos="32"></div>

          </div>
        </div>


        <div class="compartment">
          <div class="slotgrid">

            <div class="cell" data-pos="33"></div>
            <div class="cell" data-pos="34"></div>
            <div class="cell" data-pos="35"></div>

          </div>
        </div>


      </section>

    </div>


    <!-- =====================================================
         INFORMACIÓN
         ===================================================== -->

    <div id="hint"></div>

    <div id="toast"></div>


    <!-- COMBO -->

    <div
      id="comboBadge"
      class="comboBadge"
    >

      <strong id="comboText">
        COMBO x2
      </strong>

      <span id="comboReward">
        +100 🪙
      </span>

    </div>


    <!-- PARTÍCULAS -->

    <div id="particles"></div>


    <!-- =====================================================
         TIEMPO AGOTADO
         ===================================================== -->

    <div id="levelTimeoutTip">

      <strong>
        ⏱️ Tiempo agotado
      </strong>

      <div>
        No has superado este nivel.
      </div>


      <div class="modalBtns">

        <button id="retryLevelBtn">
          Reintentar nivel
        </button>

        <button
          id="exitLevelBtn"
          class="secondaryBtn"
        >
          Salir
        </button>

      </div>

    </div>


    <!-- =====================================================
         TUTORIAL
         ===================================================== -->

    <div id="tutorialTip">

      <strong>
        💡 ¿Cómo se juega?
      </strong>

      <br>

      Mueve los objetos para juntar
      los <b>3 objetos iguales</b>.

      <br>

      <div class="arrow">
        👆
      </div>

    </div>

  </main>

</div>


<!-- =======================================================
     JAVASCRIPT
     ======================================================= -->

<script src="js/config.js"></script>
<script src="js/modelo.js"></script>
<script src="js/objetos.js"></script>
<script src="js/efectos.js"></script>
<script src="js/sonido.js"></script>
<script src="js/interfaz.js"></script>
<script src="js/interaccion.js"></script>
<script src="js/niveles.js"></script>
<script src="js/juego.js"></script>


</body>
</html>
